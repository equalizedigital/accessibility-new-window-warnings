name: Build Accessibility New Window Warnings Plugin

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
  release:
    types: [created, published]

permissions:
  contents: write
  pull-requests: write

jobs:
  build-plugin:
    name: Build plugin zip
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'gha-build'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            node-${{ runner.os }}-

      - name: Install npm dependencies
        run: |
          if [ -d node_modules ]; then
            echo "node_modules cache hit, skipping install"
          else
            npm ci --prefer-offline --no-audit
          fi

      - name: Extract plugin version and commit hash
        id: version
        run: |
          VERSION=$(grep "Version:" accessibility-new-window-warnings.php | head -1 | sed 's/.*Version:[[:space:]]*\([^ ]*\).*/\1/')
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "Plugin version: $VERSION"
          echo "Short commit hash: $SHORT_SHA"

      - name: Build dist zip
        run: |
          npm run dist
          ZIP_PATH=$(ls -1 dist/*.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$ZIP_PATH" ]; then
            echo "Error: Could not locate produced zip after npm run dist" >&2
            exit 1
          fi
          mkdir -p builds

          VERSION="${{ steps.version.outputs.version }}"
          SHORT_SHA="${{ steps.version.outputs.short_sha }}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ZIP_NAME="accessibility-new-window-warnings-${VERSION}-${{ github.event.pull_request.number }}-${SHORT_SHA}.zip"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ZIP_NAME="accessibility-new-window-warnings-${VERSION}-${SHORT_SHA}.zip"
          elif [ "${{ github.event_name }}" = "release" ]; then
            ZIP_NAME="accessibility-new-window-warnings-${VERSION}.zip"
          else
            ZIP_NAME="accessibility-new-window-warnings-${VERSION}-${SHORT_SHA}.zip"
          fi

          mv "$ZIP_PATH" "builds/$ZIP_NAME"
          ZIP_BASENAME="${ZIP_NAME%.zip}"
          unzip -q "builds/$ZIP_NAME" -d "builds/$ZIP_BASENAME"
          echo "ZIP_PATH=builds/$ZIP_NAME" >> $GITHUB_ENV
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "ZIP_NAME_NO_EXT=$ZIP_BASENAME" >> $GITHUB_ENV
          echo "ZIP_FOLDER=builds/$ZIP_BASENAME" >> $GITHUB_ENV
          echo "Produced zip: builds/$ZIP_NAME"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME_NO_EXT }}
          path: ${{ env.ZIP_FOLDER }}
          if-no-files-found: error

      - name: Resolve public plugin URL for Playground
        id: playground-zip
        if: github.event.repository.private == false
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            PLUGIN_ZIP_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ github.event.release.tag_name }}/${ZIP_NAME}"
          else
            # nightly.link exposes workflow artifacts for public repositories.
            PLUGIN_ZIP_URL="https://nightly.link/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/${ZIP_NAME_NO_EXT}.zip"
          fi

          echo "plugin_zip_url=$PLUGIN_ZIP_URL" >> "$GITHUB_OUTPUT"
          echo "Plugin zip URL for Playground: $PLUGIN_ZIP_URL"

      - name: Build WordPress Playground link
        if: github.event.repository.private == false
        run: |
          export PLUGIN_ZIP_URL='${{ steps.playground-zip.outputs.plugin_zip_url }}'

          if [ -z "$PLUGIN_ZIP_URL" ]; then
            echo "No public plugin ZIP URL found; skipping Playground link generation."
            exit 0
          fi

          PLAYGROUND_URL=$(python3 - <<'PY'
          import json
          import os
          import urllib.parse

          plugin_url = os.environ["PLUGIN_ZIP_URL"]
          blueprint = {
              "landingPage": "/wp-admin/plugins.php",
              "steps": [
                  {"step": "login"},
                  {
                      "step": "installPlugin",
                      "pluginZipFile": {"resource": "url", "url": plugin_url},
                  },
                  {
                      "step": "activatePlugin",
                      "pluginPath": "accessibility-new-window-warnings/accessibility-new-window-warnings.php",
                  },
              ],
          }

          encoded = urllib.parse.quote(json.dumps(blueprint, separators=(",", ":")), safe="")
          print(f"https://playground.wordpress.net/?blueprint={encoded}")
          PY
          )

          echo "PLAYGROUND_URL=$PLAYGROUND_URL" >> "$GITHUB_ENV"
          echo "Playground URL: $PLAYGROUND_URL"

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_PATH }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on PR with build details
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const runId = context.runId;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;
            const zipName = process.env.ZIP_NAME_NO_EXT;

            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });

            const artifact = artifacts.data.artifacts.find(a => a.name === zipName);
            const downloadUrl = artifact
              ? `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}/artifacts/${artifact.id}`
              : runUrl;

            const playgroundUrl = process.env.PLAYGROUND_URL;
            const playgroundLine = playgroundUrl
              ? `\n- **Playground**: [Open with plugin preinstalled](${playgroundUrl})`
              : `\n- **Playground**: Not available for this run (repository may be private or plugin ZIP URL is not publicly accessible).`;

            const body = `✅ Accessibility New Window Warnings build\n\n- **Artifact**: [Download ${zipName}.zip](${downloadUrl})\n- **Workflow run**: [View logs](${runUrl})${playgroundLine}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });

      - name: Remove triggering label from PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                name: 'gha-build',
              });
              console.log(`Removed label 'gha-build' from PR #${prNumber}`);
            } catch (e) {
              console.log(`Could not remove label 'gha-build' from PR #${prNumber}: ${e.message}`);
            }

      - name: Summary
        run: |
          echo "=== Build Summary ==="
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Zip: ${{ env.ZIP_PATH }}"
          if [ -n "${PLAYGROUND_URL}" ]; then
            echo "Playground: ${PLAYGROUND_URL}"
          else
            echo "Playground: skipped (repo is private or URL unavailable)"
          fi
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "Uploaded to release: ${{ github.event.release.html_url }}"
          fi
