name: Generate POT file

on:
  workflow_dispatch:
    inputs:
      base:
        description: 'Base branch to compare and create PR against.'
        required: false
        default: 'develop'

jobs:
  make-pot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # `wp i18n make-pot` is static analysis over the source tree, so it needs
      # neither a database nor an installed WordPress. No build step either: it
      # reads src/ directly and nothing in build/ is committed.
      - name: Set up PHP with wp-cli
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: wp-cli
          coverage: none

      # This plugin has no dist build, so the POT is generated straight into the
      # committed languages/ folder. That file is also the baseline the next
      # step diffs against, so it is stashed first.
      - name: Generate POT file
        run: |
          if [ -f languages/accessibility-new-window-warnings.pot ]; then
            cp languages/accessibility-new-window-warnings.pot "${RUNNER_TEMP}/accessibility-new-window-warnings.pot.baseline"
          fi
          wp i18n make-pot . languages/accessibility-new-window-warnings.pot

      - name: Check if POT file changed (ignoring some headers)
        id: pot_diff
        run: |
          if [ -f languages/accessibility-new-window-warnings.pot ] && [ -f "${RUNNER_TEMP}/accessibility-new-window-warnings.pot.baseline" ]; then
            diff_output=$(diff \
              <(grep -vE '^("?(POT-Creation-Date|PO-Revision-Date|X-Generator|Project-Id-Version):|#|$)' languages/accessibility-new-window-warnings.pot) \
              <(grep -vE '^("?(POT-Creation-Date|PO-Revision-Date|X-Generator|Project-Id-Version):|#|$)' "${RUNNER_TEMP}/accessibility-new-window-warnings.pot.baseline") || true)
            if [ -n "$diff_output" ]; then
              echo "pot_changed=true" >> $GITHUB_OUTPUT
            else
              echo "pot_changed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "pot_changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Upload POT file as artifact
        if: steps.pot_diff.outputs.pot_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-new-window-warnings-i18n
          path: languages/accessibility-new-window-warnings.pot

      - name: Set up Git for PR
        if: steps.pot_diff.outputs.pot_changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # No copy-back step: the POT was generated in place. Only the .pot is
      # committed - this previously replaced the whole languages/ directory, but
      # the .po/.mo files in there come from the external translation system and
      # are not this workflow's to touch.
      - name: Create or Update Pull Request with updated translations
        if: steps.pot_diff.outputs.pot_changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: ./languages/accessibility-new-window-warnings.pot
          commit-message: Update translation files (POT)
          title: Update translation files (POT)
          body: This PR updates the POT translation file generated by the workflow.
          branch: update-translations/${{ github.head_ref || github.ref_name }}
          base: ${{ github.event.inputs.base || github.head_ref || github.ref_name }}
          delete-branch: true
